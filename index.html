/* Concept : l'appli de Cyril, même univers violet, plateau défilant + barre de commandes fixe en bas (palette + boutons) pour jouer au pouce sur iPhone. */
:root {
  --bg: #5b4fc4;

  --g2: #764ba2;
  --card: #ffffff;
  --ink: #26233a;
  --muted: #6b6880;

  --accent: #5545d0;
  --accent-ink: #ffffff;
  --accent2: #764ba2;
  --accent2-ink: #ffffff;
  --neutral: #e6e3f3;
  --neutral-ink: #3f3b58;
  --off: #cfcce0;
  --off-ink: #7a7791;
  --good-bg: #d8f3e0;
  --good-ink: #14532d;
  --bad-bg: #fbdcdc;

  --fb-black: #1d1b2c;

  --fb-white-bd: #4a4666;

}

  --off-ink: #85829f;
  --good-bg: #17402a;
  --good-ink: #c9f2d6;
  --bad-bg: #4a1f24;
  --bad-ink: #ffd6d6;
  --hint-bg: #4a3d12;
  --hint-ink: #ffe9a8;
  --fb-bg: #38345c;
  --fb-empty: #2a2748;

  --fb-black-bd: #ecebf7;
  --fb-white: #f4f3fb;
  --fb-white-bd: #8f8bb0;
  --secret-peg: #3b3760;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { touch-action: manipulation; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
  padding-block: 16px 150px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.app { max-width: 480px; margin: 0 auto; }
.card {
  background: var(--card);
  border-radius: 20px;
  padding: 16px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
}

/* En-tête */
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.logo { width: 40px; height: 40px; flex: none; display: block; border-radius: 10px; }
.titles { flex: 1; min-width: 0; }
h1 { margin: 0; font-size: 24px; line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
.subtitle { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.sym-toggle {
  flex: none;
  border: 1px solid var(--peg-bd);
  background: var(--panel);
  color: var(--neutral-ink);
  border-radius: 999px;
  padding: 7px 12px;
  min-height: 36px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.sym-toggle[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Statistiques */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--panel); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stat b { display: block; font-size: 20px; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

/* Code secret */
.secret-wrap { background: var(--panel); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
.label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.secret { display: flex; gap: 8px; flex: 1; justify-content: center; }
.secret .s-peg {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--secret-peg);
  border: 3px solid var(--peg-bd);
  display: grid; place-items: center;
  color: var(--muted); font-weight: 700; font-size: 15px;
}
.secret .s-peg.revealed { border-color: rgba(0, 0, 0, 0.18); color: transparent; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2); }
.attempts { text-align: right; line-height: 1.1; }
.attempts b { display: block; font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }

/* Message */
.msg { display: none; text-align: center; padding: 11px 12px; border-radius: 12px; margin-bottom: 12px; font-weight: 700; font-size: 14px; }
.msg.show { display: block; }
.msg.win { background: var(--good-bg); color: var(--good-ink); }
.msg.lose { background: var(--bad-bg); color: var(--bad-ink); }
.msg.hint { background: var(--hint-bg); color: var(--hint-ink); }

/* Plateau */
.board { display: flex; flex-direction: column; gap: 6px; }
.row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  background: var(--row);
  border: 2px solid transparent;
  border-radius: 12px;
}
.row.current { background: var(--row-cur); border-color: var(--row-cur-bd); }
.row.done { background: var(--row-done); }
.num { width: 18px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.pegs { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 42px)); gap: 8px; justify-content: center; }
.feedback { display: grid; grid-template-columns: repeat(2, 13px); grid-template-rows: repeat(2, 13px); gap: 3px; padding: 4px; background: var(--fb-bg); border-radius: 8px; }
.fb { width: 13px; height: 13px; border-radius: 50%; background: var(--fb-empty); border: 1px solid var(--fb-empty-bd); }
.fb.black { background: var(--fb-black); border-color: var(--fb-black-bd); }
.fb.white { background: var(--fb-white); border-color: var(--fb-white-bd); }
.note { margin: 12px 0 0; font-size: 12px; color: var(--muted); text-align: center; }
.legend { margin: 8px 0 0; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .fb { flex: none; }

/* Pions */
.peg {
  appearance: none; -webkit-appearance: none;
  width: 100%; aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border-radius: 50%;
  border: 3px solid var(--peg-bd);
  background: var(--peg-empty);
  display: grid; place-items: center;
  cursor: pointer;
  transition: transform 0.1s;
  color: inherit;
}
.peg:active:not(:disabled) { transform: scale(0.92); }
.peg:disabled { cursor: default; }
.peg.filled { border-color: rgba(0, 0, 0, 0.2); box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.18), 0 2px 4px rgba(0, 0, 0, 0.12); }
.peg:focus-visible, .btn:focus-visible, .sym-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.glyph { width: 58%; height: 58%; pointer-events: none; display: none; }
.glyph * { fill: rgba(255, 255, 255, 0.96); stroke: rgba(0, 0, 0, 0.6); stroke-width: 1.6; stroke-linejoin: round; }
body.sym .glyph { display: block; }

/* Barre de commandes fixe */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--card);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.25);
  padding-top: 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-in { max-width: 480px; margin: 0 auto; display: grid; gap: 10px; }
.palette { display: flex; justify-content: center; gap: 10px; }
.palette .peg { width: 46px; height: 46px; flex: none; box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.2), 0 2px 4px rgba(0, 0, 0, 0.12); border-color: rgba(0, 0, 0, 0.18); }
.palette .peg.selected { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--accent), inset 0 -4px 8px rgba(0, 0, 0, 0.2); transform: translateY(-2px); }
.btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.btn {
  appearance: none; -webkit-appearance: none;
  border: 0; border-radius: 12px;
  min-height: 48px; padding: 0 8px;
  font: inherit; font-weight: 700; font-size: 15px;
  cursor: pointer;
  background: var(--neutral); color: var(--neutral-ink);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn-ok { background: var(--accent); color: var(--accent-ink); }
.btn-new { background: var(--neutral); color: var(--neutral-ink); }
.btn-new.primary { background: var(--accent2); color: var(--accent2-ink); }
.btn:disabled { background: var(--off); color: var(--off-ink); cursor: not-allowed; }

@media (prefers-reduced-motion: no-preference) {
  .shake { animation: shake 0.4s; }
  .pop { animation: pop 0.3s; }
}
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
@media (max-width: 360px) {
  .secret-wrap { flex-wrap: wrap; row-gap: 8px; }
  .secret-wrap > div:first-child { flex: 1; }
  .secret { order: 3; flex-basis: 100%; }
  .attempts { order: 2; }
  .palette { gap: 6px; }
  .palette .peg { width: 42px; height: 42px; }
}
</style>
</head>

    <div class="secret-wrap">
      <div>
        <div class="label">Code secret</div>
      </div>
      <div class="secret" id="secret" aria-label="Code secret"></div>
      <div class="attempts"><b id="attempts-left">10</b><span class="label">coups</span></div>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="board" id="board"></div>

    <p class="legend">
      <span><i class="fb black"></i> bonne couleur, bonne place</span>
      <span><i class="fb white"></i> bonne couleur, mauvaise place</span>
    </p>
    <p class="note">Touchez un pion posé pour le retirer ou le remplacer. Abandonner une partie en cours compte comme une défaite.</p>
  </div>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="palette" id="palette" role="group" aria-label="Couleurs"></div>
    <div class="btns">
      <button type="button" class="btn btn-ok" id="btn-validate">Valider</button>
      <button type="button" class="btn" id="btn-clear">Effacer</button>
      <button type="button" class="btn btn-new" id="btn-new">Nouvelle</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var COLORS = [
    { name: "Rouge",  hex: "#e74c3c" },
    { name: "Bleu",   hex: "#2f80d0" },
    { name: "Vert",   hex: "#27ae60" },
    { name: "Jaune",  hex: "#f1c40f" },
    { name: "Violet", hex: "#8e44ad" },
    { name: "Orange", hex: "#e67e22" }
  ];
  // Une forme par couleur, pour distinguer les couleurs sans se fier à la teinte seule
  var SHAPES = [
    '<polygon points="12,4.5 20.5,19 3.5,19"/>',
    '<rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/>',
    '<circle cx="12" cy="12" r="7"/>',
    '<polygon points="12,3.5 20.5,12 12,20.5 3.5,12"/>',
    '<polygon points="12,4 14,9.25 19.61,9.53 15.23,13.05 16.7,18.47 12,15.4 7.3,18.47 8.77,13.05 4.39,9.53 10,9.25"/>',
    '<polygon points="10,5 14,5 14,10 19,10 19,14 14,14 14,19 10,19 10,14 5,14 5,10 10,10"/>'
  ];
  var LEN = 4, MAX = 10;
  var KEY_STATS = "mastermind-stats", KEY_SYM = "mastermind-formes";

  var secret = [], guess = [], rows = [], row = 0, sel = 0, over = false, won = false;
  var stats = { wins: 0, games: 0, streak: 0 };

  var el = {
    board: document.getElementById("board"),
    palette: document.getElementById("palette"),
    secret: document.getElementById("secret"),
    msg: document.getElementById("msg"),
    left: document.getElementById("attempts-left"),
    ok: document.getElementById("btn-validate"),
    clear: document.getElementById("btn-clear"),
    nu: document.getElementById("btn-new"),
    sym: document.getElementById("sym-toggle")
  };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function glyph(i) {
    return '<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">' + SHAPES[i] + "</svg>";
  }

  /* ---------- Statistiques ---------- */
  (function loadStats() {
    var raw = lsGet(KEY_STATS);
    if (!raw) return;
    try {
      var o = JSON.parse(raw);
      if (o && typeof o === "object") {
        stats.wins = Math.max(0, parseInt(o.wins, 10) || 0);
        stats.games = Math.max(0, parseInt(o.games, 10) || 0);
        stats.streak = Math.max(0, parseInt(o.streak, 10) || 0);
      }
    } catch (e) {}
  })();

  function showStats() {
    document.getElementById("wins").textContent = stats.wins;
    document.getElementById("games").textContent = stats.games;
    document.getElementById("streak").textContent = stats.streak;
  }
  function saveStats() { lsSet(KEY_STATS, JSON.stringify(stats)); showStats(); }

  /* ---------- Formes (accessibilité) ---------- */
  function setSymbols(on) {
    document.body.classList.toggle("sym", on);
    el.sym.setAttribute("aria-pressed", on ? "true" : "false");
    lsSet(KEY_SYM, on ? "1" : "0");
  }
  setSymbols(lsGet(KEY_SYM) !== "0");
  el.sym.addEventListener("click", function () {
    setSymbols(el.sym.getAttribute("aria-pressed") !== "true");
  });

  /* ---------- Règle de score ---------- */
  function score(code, attempt) {
    var s = code.slice(), g = attempt.slice(), black = 0, white = 0, i, k;
    for (i = 0; i < LEN; i++) {
      if (g[i] === s[i]) { black++; s[i] = -1; g[i] = -2; }
    }
    for (i = 0; i < LEN; i++) {
      if (g[i] >= 0) {
        k = s.indexOf(g[i]);
        if (k !== -1) { white++; s[k] = -1; }
      }
    }
    return { black: black, white: white };
  }

  /* ---------- Construction ---------- */
  function buildPalette() {
    el.palette.innerHTML = "";
    COLORS.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "peg filled" + (i === sel ? " selected" : "");
      b.style.background = c.hex;
      b.setAttribute("aria-label", c.name);
      b.setAttribute("aria-pressed", i === sel ? "true" : "false");
      b.innerHTML = glyph(i);
      b.addEventListener("click", function () { selectColor(i); });
      el.palette.appendChild(b);
    });
  }

  function selectColor(i) {
    sel = i;
    var all = el.palette.children;
    for (var k = 0; k < all.length; k++) {
      all[k].classList.toggle("selected", k === i);
      all[k].setAttribute("aria-pressed", k === i ? "true" : "false");
    }
  }

  function buildBoard() {
    el.board.innerHTML = "";
    rows = [];
    for (var r = 0; r < MAX; r++) {
      var rowEl = document.createElement("div");
      rowEl.className = "row";
      var num = document.createElement("div");
      num.className = "num";
      num.textContent = r + 1;
      var pegsEl = document.createElement("div");
      pegsEl.className = "pegs";
      var pegs = [];
      for (var c = 0; c < LEN; c++) {
        var p = document.createElement("button");
        p.type = "button";
        p.className = "peg";
        p.disabled = true;
        p.setAttribute("aria-label", "Ligne " + (r + 1) + ", pion " + (c + 1) + " : vide");
        (function (rr, cc) {
          p.addEventListener("click", function () { onPeg(rr, cc); });
        })(r, c);
        pegsEl.appendChild(p);
        pegs.push(p);
      }
      var fb = document.createElement("div");
      fb.className = "feedback";
      var fbs = [];
      for (var f = 0; f < LEN; f++) {
        var fp = document.createElement("div");
        fp.className = "fb";
        fb.appendChild(fp);
        fbs.push(fp);
      }
      rowEl.appendChild(num);
      rowEl.appendChild(pegsEl);
      rowEl.appendChild(fb);
      el.board.appendChild(rowEl);
      rows.push({ el: rowEl, pegs: pegs, fbs: fbs });
    }
  }

  function buildSecret(reveal) {
    el.secret.innerHTML = "";
    for (var i = 0; i < LEN; i++) {
      var d = document.createElement("div");
      d.className = "s-peg" + (reveal ? " revealed" : "");
      if (reveal) {
        d.style.background = COLORS[secret[i]].hex;
        d.title = COLORS[secret[i]].name;
        d.innerHTML = glyph(secret[i]);
      } else {
        d.textContent = "?";
      }
      el.secret.appendChild(d);
    }
  }

  /* ---------- Jeu ---------- */
  function setPeg(c, idx) {
    var p = rows[row].pegs[c];
    guess[c] = idx;
    if (idx === null) {
      p.style.background = "";
      p.classList.remove("filled");
      p.innerHTML = "";
      p.setAttribute("aria-label", "Ligne " + (row + 1) + ", pion " + (c + 1) + " : vide");
    } else {
      p.style.background = COLORS[idx].hex;
      p.classList.add("filled");
      p.innerHTML = glyph(idx);
      p.setAttribute("aria-label", "Ligne " + (row + 1) + ", pion " + (c + 1) + " : " + COLORS[idx].name);
    }
  }

  function onPeg(r, c) {
    if (over || r !== row) return;
    hideMsg();
    if (guess[c] === sel) setPeg(c, null);   // même couleur : on retire le pion
    else setPeg(c, sel);                      // vide ou autre couleur : on pose / remplace
  }

  function clearRow() {
    if (over) return;
    hideMsg();
    for (var c = 0; c < LEN; c++) setPeg(c, null);
  }

  function activateRow() {
    for (var r = 0; r < MAX; r++) {
      var on = (r === row) && !over;
      rows[r].el.classList.toggle("current", on);
      rows[r].el.classList.toggle("done", r < row || (over && r === row && won));
      for (var c = 0; c < LEN; c++) rows[r].pegs[c].disabled = !on;
    }
  }

  function updateUI() {
    var remaining = MAX - row - (won ? 1 : 0);
    el.left.textContent = Math.max(0, remaining);
    el.ok.disabled = over;
    el.clear.disabled = over;
    el.nu.classList.toggle("primary", over);
    activateRow();
  }

  function showMsg(text, type) {
    el.msg.textContent = text;
    el.msg.className = "msg show " + type;
  }
  function hideMsg() { el.msg.className = "msg"; el.msg.textContent = ""; }

  function shake(node) {
    node.classList.remove("shake");
    void node.offsetWidth;
    node.classList.add("shake");
  }

  function scrollToRow(i) {
    if (!rows[i]) return;
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try { rows[i].el.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" }); } catch (e) {}
  }

  function validate() {
    if (over) return;
    if (guess.indexOf(null) !== -1) {
      shake(rows[row].el);
      showMsg("Complétez les 4 pions avant de valider.", "hint");
      return;
    }
    var res = score(secret, guess), i, n = 0;
    for (i = 0; i < res.black; i++) rows[row].fbs[n++].classList.add("black");
    for (i = 0; i < res.white; i++) rows[row].fbs[n++].classList.add("white");
    hideMsg();

    if (res.black === LEN) { finish(true); return; }
    row++;
    guess = [null, null, null, null];
    if (row >= MAX) { finish(false); return; }
    updateUI();
    scrollToRow(row);
  }

  function finish(win) {
    over = true;
    won = win;
    stats.games++;
    if (win) { stats.wins++; stats.streak++; } else { stats.streak = 0; }
    saveStats();
    buildSecret(true);
    if (win) {
      var n = row + 1;
      showMsg("Code trouvé en " + n + " coup" + (n > 1 ? "s" : "") + " !", "win");
    } else {
      showMsg("Perdu. Le code était : " + secret.map(function (i) { return COLORS[i].name; }).join(", ") + ".", "lose");
    }
    el.msg.classList.add("pop");
    updateUI();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function newGame() {
    // Abandonner une partie entamée compte comme une défaite
    if (!over && row > 0) {
      stats.games++;
      stats.streak = 0;
      saveStats();
    }
    secret = [];
    for (var i = 0; i < LEN; i++) secret.push(Math.floor(Math.random() * COLORS.length));
    guess = [null, null, null, null];
    row = 0; over = false; won = false;
    hideMsg();
    buildBoard();
    buildSecret(false);
    updateUI();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  el.ok.addEventListener("click", validate);
  el.clear.addEventListener("click", clearRow);
  el.nu.addEventListener("click", newGame);

  buildPalette();
  showStats();
  newGame();
})();
</script>
</body>
</html>
